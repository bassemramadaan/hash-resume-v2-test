    <script>
      // Gracefully handle HMR WebSocket in AI Studio cloud environment
      (function() {
        if (typeof window === 'undefined') return;

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event && event.reason ? String(event.reason.message || event.reason) : '';
          if (msg.includes('WebSocket closed without opened') || msg.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event ? String(event.message || (event.error && event.error.message) || '') : '';
          if (msg.includes('WebSocket closed without opened') || msg.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var ws = protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
            var openCallbacks = [];
            var origAddEventListener = ws.addEventListener.bind(ws);

            ws.addEventListener = function(type, listener, options) {
              if (type === 'open' && typeof listener === 'function') {
                openCallbacks.push(listener);
              }
              if (type === 'close' && typeof listener === 'function') {
                var wrappedClose = function(event) {
                  if (openCallbacks.length > 0) {
                    var cbs = openCallbacks.slice();
                    openCallbacks = [];
                    cbs.forEach(function(fn) {
                      try { fn.call(ws, new Event('open')); } catch(e) {}
                    });
                  }
                  try {
                    return listener.apply(this, arguments);
                  } catch (err) {}
                };
                return origAddEventListener(type, wrappedClose, options);
              }
              return origAddEventListener(type, listener, options);
            };
            return ws;
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }
      })();
    </script>
